id: https://w3id.org/OHD/MH-study/phq_9
name: phq_9
title: PHQ-9 Study Schema
license: https://mit-license.org/

description: >-
  LinkML schema for defining data elements used in the PHQ-9 study.

prefixes:
  linkml: https://w3id.org/linkml/
  core: https://w3id.org/OHD/DFA-study/core/
  cohra2: https://w3id.org/OHD/DFA-study/cohra2/
  OHD:  http://purl.obolibrary.org/obo/OHD_
  dcterms: http://purl.org/dc/terms/
  dwc: http://rs.tdwg.org/dwc/terms/

imports:
  - linkml:types
  - core
default_range: string
default_prefix: phq9

enums:
  PHQ9ResponseScale:
    description: >-
      Standard PHQ-09 response scale:
      0=Not at all, 1=Several days,
      2=More than half the days, 3=Nearly every day.
    permissible_values:
      0:
        description: Not at all
      1:
        description: Several days
      2:
        description: More than half the days
      3:
        description: Nearly every day

  PHQ9Severity:
      description: >-
        PHQ-9 severity category based on total score:
        0–4 minimal, 5–9 mild, 10–14 moderate,
        15–19 moderately severe, 20–27 severe.
      permissible_values:
        minimal:
          description: Minimal or no depression (0–4)
        mild:
          description: Mild depression (5–9)
        moderate:
          description: Moderate depression (10–14)
        moderately_severe:
          description: Moderately severe depression (15–19)
        severe:
          description: Severe depression (20–27)
classes:
  PHQ9Dataset:
    is_a: Dataset
    description: >-
      A dataset containing one or more PHQ-9 recors.
    slot_usage:
      records:
        range: PHQ9Record

  PHQ9Record:
    is_a: Record
    description: >-
      A single PHQ-9 questionnaire administration for one participant at one timepoint.
    slots:
      - Participant_ID
      - Timepoint
      - Age
      - Sex
      - phq9_item_1
      - phq9_item_1
      - phq9_item_2
      - phq9_item_3
      - phq9_item_4
      - phq9_item_5
      - phq9_item_6
      - phq9_item_7
      - phq9_item_8
      - phq9_item_9
      - total_score
      - severity

slots:
  Participant_ID: 
    description: >-
      The participant's study ID.
    range: integer
  Timepoint:
    description: >-
      The timepoint in the study when the visit occurred.
    range: integer
  TimepointDesc:
    description: >-
      Description of the timepoint.
    range: string
  Site:
    description: >-
      The code for the study site where the assessment was given.
    range: string
  Pedigree_Name:
    description: >-
      The Family pedigree number assigned by genetic relationship.
    range: integer
  Age:
    description: >-
      The particpant's age at the time of the visit.
    range: float
  Sex:
    description: >-
      The particpant's sex
    range: integer
  demRace:
    description: >-
      What is your race/ethnicity?
    range: integer
  Ethnicity:
    description: >-
      Hispanic or Latino
    range: integer
   phq9_item_1:
    description: >-
      Little interest or pleasure in doing things.
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf OHD:0000421 # DFS 01
    range: PHQ9ResponseScale
   phq9_item_2:
    description: >-
      Feeling down, depressed, or hopeless
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf OHD:0000422 # DFS 02
    range: PHQ9ResponseScale
   phq9_item_3:
    description: >-
      Trouble falling or staying asleep, or sleeping too much
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf OHD:0000423 # DFS 03
    range: PHQ9ResponseScale
   phq9_item_4:
    description: >-
      Feeling tired or having little energy
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf OHD:0000424 # DFS 04
    range: PHQ9ResponseScale
   phq9_item_5:
    description: >-
      Poor appetite or overeating
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf OHD:0000426 # DFS 05
    range: PHQ9ResponseScale
   phq9_item_6:
    description: >-
      Feeling bad about yourself—or that you are a failure or have let yourself or your family down. 
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf OHD:0000427 # DFS 06
    range: PHQ9ResponseScale
   phq9_item_7:
    description: >-
      Trouble concentrating on things, such as reading the newspaper or watching television.
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf OHD:0000428 # DFS 07
    range: PHQ9ResponseScale
   phq9_item_8:
    description: >-
      Moving or speaking so slowly that other people could have noticed; or the opposite—being so fidgety or restless that you have been moving around a lot more than usual.
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf OHD:0000429 # DFS 08
    range: PHQ9ResponseScale
   phq9_item_9:
    description: >-
      Thoughts that you would be better off dead or of hurting yourself in some way.
    annotations:
      pun_as: rdf:type owl:Class; rdfs:subClassOf OHD:0000430 # DFS 09
    range: PHQ9ResponseScale
  
  total_score:
      description: >-
        Sum of the nine PHQ-9 item scores (expected range 0–27).
        Computed outside the schema but stored here for analysis.
      range: integer
      minimum_value: 0
      maximum_value: 27
  
    severity:
      description: >-
        PHQ-9 severity category derived from the total_score.
      range: PHQ9Severity
